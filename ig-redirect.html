<style>

    display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;}

<body>
<div>Taking you to Instagram…</div>

<script src="https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js"></script>
<script type="text/javascript">

  mixpanel.init("bf3570ccc4b032d162b0415eda281a30", {track_pageview: false, persistence: "localStorage"});

  var params = new URLSearchParams(window.location.search);
  var utmProps = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(key){
    var val = params.get(key);
    if (val) utmProps[key] = val;
  });
  if (Object.keys(utmProps).length > 0) {
    mixpanel.register(utmProps);
  }

  var destination = "https://www.instagram.com/bearcreekbackyardultra/";

  mixpanel.track('Instagram Click', {page: 'ig-redirect', destination: destination}, {
    transport: 'sendBeacon',
    send_immediately: true
  });

  setTimeout(function(){
    window.location.href = destination;
  }, 250);
